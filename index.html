
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花枝丸的寵物小屋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🐾 我的寵物小屋</h1>

        <div class="pet-room">
            <div class="pet">
                <img id="petImage" src="images/huazhiwan.png" alt="花枝丸">
            </div>

            <p id="petMessage">汪！今天也要一起玩嗎？</p>
            <<h2 id="petName">花枝丸</h2>

            <div class="name-setting">
                <input
                    type="text"
                    id="nameInput"
                    placeholder="幫狗狗取個名字"
                    maxlength="10"
                >
                <button onclick="changePetName()">確認名字</button>
            </div>

            <p id="petMessage">汪！今天也要一起玩嗎？</p>
        </div>

        <div class="status">
            <p>🍖 飽食度：<span id="hunger">80</span></p>
            <p>💗 心情：<span id="mood">80</span></p>
            <p>⚡ 體力：<span id="energy">80</span></p>
        </div>

        <div class="actions">
            <button onclick="feedPet()">🍖 餵食</button>
            <button onclick="playPet()">🎾 玩耍</button>
            <button onclick="sleepPet()">💤 睡覺</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
